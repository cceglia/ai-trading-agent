services:
  trading-agent:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: trading-agent:prod
    container_name: trading-agent-prod
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000

    restart: unless-stopped

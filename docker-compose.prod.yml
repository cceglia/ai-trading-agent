services:
  trading-agent:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    image: trading-agent:prod
    container_name: trading-agent-prod
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000

    # API-liveness healthcheck (NFR §18 / ticket 08). It probes /health — the
    # API process liveness seam — NOT /readiness, so a down/absent terminal
    # MCP data source (reported by /readiness as not-ready) never marks the
    # container as unhealthy: the API can be up while the data source is not.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: unless-stopped
